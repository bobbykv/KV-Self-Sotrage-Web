name: Refresh SiteLink inventory

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sitelink-inventory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh production inventory
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::CRON_SECRET is not configured."
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            --connect-timeout 15 --max-time 120 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --output "$response_file" --write-out '%{http_code}' \
            https://kv-self-storage-web.vercel.app/api/cron/inventory)"
          cat "$response_file"
          if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Inventory refresh returned HTTP $status."
            exit 1
          fi
