services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kv
      POSTGRES_PASSWORD: kv
      POSTGRES_DB: kv_self_storage_test
    ports:
      - "55432:5432"
    volumes:
      - kv_self_storage_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kv -d kv_self_storage_test"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  kv_self_storage_test_data:
